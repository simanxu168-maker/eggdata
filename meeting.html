<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>研究中心内部行情策略会</title>
<style>
:root{
    --side:#20222a; --side2:#2a2d37; --head:#393d49;
    --teal:#009688; --teal2:#00897b; --orange:#ff5722;
    --page:#f2f3f5; --card:#fff; --line:#e6e8ec;
    --txt:#333; --txt2:#666; --txt3:#999;
    --red:#bf242a; --green:#0a7d63;
    --r:6px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  html,body{margin:0;padding:0;}
  body{background:var(--page);color:var(--txt);font-size:13px;line-height:1.7;
    font-family:"Helvetica Neue",Helvetica,"PingFang SC","Microsoft YaHei",Tahoma,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  /* ---------- 顶栏 ---------- */
  .topbar{position:fixed;top:0;right:0;left:0;height:52px;background:var(--head);z-index:40;
    display:flex;align-items:center;gap:14px;padding:0 16px;box-shadow:0 1px 4px rgba(0,0,0,.18);}
  .burger{width:26px;height:22px;display:flex;flex-direction:column;justify-content:space-between;
    cursor:pointer;flex:0 0 auto;}
  .burger span{display:block;height:2px;background:#cfd3dc;border-radius:2px;}
  .topbar h1{margin:0;font-size:15px;font-weight:600;color:#fff;letter-spacing:.02em;white-space:nowrap;}
  .topbar h1 small{font-weight:400;font-size:12px;color:rgba(255,255,255,.55);margin-left:8px;}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.94);
    border-radius:4px;height:32px;padding:0 10px;width:250px;}
  .search input{border:0;outline:0;font-size:12.5px;color:#333;width:100%;background:transparent;}
  .search input::placeholder{color:#9aa0ab;}
  .topdate{color:rgba(255,255,255,.72);font-size:12px;white-space:nowrap;}

  /* ---------- 左侧目录 ---------- */
  .topbar{left:224px;}
  .side{position:fixed;left:0;top:0;bottom:0;width:224px;background:var(--side);color:#fff;z-index:50;
    overflow-y:auto;}
  .side::-webkit-scrollbar{width:4px;} .side::-webkit-scrollbar-thumb{background:#3a3f4b;}
  .brand{height:52px;display:flex;align-items:center;gap:9px;padding:0 16px;background:#1b1d24;
    border-bottom:1px solid rgba(255,255,255,.06);}
  .brand i{width:16px;height:16px;background:linear-gradient(135deg,var(--orange),#ff8a65);
    border-radius:3px;display:inline-block;transform:rotate(45deg);}
  .brand b{font-size:12.5px;font-weight:600;letter-spacing:.01em;line-height:1.35;}
  .grp{padding:12px 0 2px;}
  .grp-t{font-size:11.5px;color:rgba(255,255,255,.42);letter-spacing:.1em;padding:0 16px 6px;}
  .item{display:flex;align-items:center;gap:9px;height:42px;padding:0 16px;color:rgba(255,255,255,.74);
    font-size:13.5px;cursor:pointer;border:0;background:none;width:100%;text-align:left;
    transition:background .15s,color .15s;}
  .item:hover{background:var(--side2);color:#fff;}
  .item.on{background:var(--teal);color:#fff;font-weight:600;}
  .item .ic{display:none;}
  .item::before{content:"";flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.34);}
  .item.on::before{background:#fff;}
  .item .cnt{margin-left:auto;font-size:11px;color:rgba(255,255,255,.45);}
  .item.on .cnt{color:rgba(255,255,255,.8);}
  .wk{height:38px;font-size:12.5px;}
  .wk.on{background:rgba(0,150,136,.16);color:#fff;border-left:3px solid var(--teal);}
  .side-foot{padding:16px;font-size:11px;color:rgba(255,255,255,.38);line-height:1.8;}

  /* ---------- 主体 ---------- */
  .main{margin:52px 0 0 224px;padding:16px 18px 40px;display:grid;
    grid-template-columns:minmax(0,1fr) 296px;gap:16px;align-items:start;}
  .col-main{min-width:0;}

  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .tile .h{height:26px;display:flex;align-items:center;justify-content:center;color:#fff;
    font-size:12px;font-weight:600;letter-spacing:.04em;}
  .tile .b{padding:12px 10px 14px;text-align:center;}
  .tile .v{font-size:23px;font-weight:700;line-height:1.15;letter-spacing:-.02em;}
  .tile .s{font-size:11.5px;color:var(--txt3);margin-top:2px;}
  .t1 .h{background:#132b6b;} .t2 .h{background:var(--teal);}
  .t3 .h{background:#6e0000;} .t4 .h{background:#00401c;}

  .tabs{display:inline-flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;background:#fff;
    border:1px solid var(--line);border-radius:8px;padding:5px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .tab{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:#4a5560;font-size:13.5px;
    padding:9px 16px;border-radius:6px;cursor:pointer;transition:.15s;line-height:1;}
  .tab .ti{display:none;}
  .tab:hover{background:#f1f7f6;color:var(--teal);}
  .tab.on{background:var(--teal);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(0,150,136,.3);}
  .tab.on .ti{opacity:1;}
  .tab .tn{font-style:normal;font-size:11px;line-height:1;padding:3px 6px;border-radius:8px;
    background:#f1f3f5;color:#8b939d;}
  .tab.on .tn{background:rgba(255,255,255,.22);color:#fff;}

  .fab{position:fixed;right:14px;bottom:18px;z-index:70;display:none;align-items:center;gap:7px;
    background:var(--teal);color:#fff;border:0;border-radius:24px;padding:12px 16px;font-size:13.5px;
    font-weight:600;box-shadow:0 6px 20px rgba(0,150,136,.45);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:0 1px 2px rgba(0,0,0,.03);margin-bottom:14px;}
  .card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid #f2f3f5;}
  .card-h h2{margin:0;font-size:15px;font-weight:600;color:#222;}
  .card-h .sub{font-size:12px;color:var(--txt3);}
  .card-h .right{margin-left:auto;font-size:12px;color:var(--teal);}
  .card-b{padding:14px 16px 16px;}

  /* 报告信息 */
  .info{padding:18px 20px 16px;}
  .info h1{margin:0 0 10px;font-size:23px;font-weight:600;color:#1f2226;letter-spacing:.01em;line-height:1.35;}
  .info .meta{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:12.5px;color:var(--txt2);}
  .info .note{margin:12px 0 0;padding-top:11px;border-top:1px dashed #eceef1;font-size:11.5px;
    line-height:1.9;color:#9aa4ac;}

  /* 品种 pill */
  .pills{display:flex;flex-wrap:nowrap;gap:7px;margin:0;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;flex:1;}
  .pillbar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
    border-radius:8px;padding:8px 12px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .plab{flex:0 0 auto;font-size:12px;color:#98a2ae;letter-spacing:.06em;}
  .pill{flex:0 0 auto;border:1px solid #dfe3e7;background:#fff;color:#4a5560;font-size:12.5px;padding:7px 14px;
    border-radius:4px;cursor:pointer;transition:.15s;}
  .pill:hover{border-color:#bcd9d4;color:var(--teal);}
  .pill.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}

  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
  .kcard{border:1px solid #edeff2;border-radius:5px;padding:10px 12px;transition:.15s;}
  .kcard:hover{border-color:#d9e5e3;background:#fcfdfd;}
  .khead{display:flex;align-items:baseline;gap:6px;margin-bottom:4px;}
  .kname{font-size:13.5px;font-weight:600;color:#222;}
  .stars{font-size:11px;letter-spacing:1.5px;color:var(--orange);}
  .kboard{font-size:11px;color:#7b8794;background:#f4f6f7;border-radius:3px;padding:1px 6px;margin-left:auto;}
  .kview{margin:0;font-size:12px;line-height:1.75;color:var(--txt2);}
  .kview:empty{display:none;}

  .pools{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .pool{border:1px solid #edeff2;border-radius:5px;overflow:hidden;}
  .pool .ph{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;
    font-size:13px;font-weight:600;}
  .pool .pb{padding:11px 12px 12px;display:flex;flex-wrap:wrap;gap:7px;}
  .chip{border:1px solid #e6e8ec;border-radius:4px;padding:4px 9px;font-size:12px;background:#fff;
    font-family:inherit;cursor:pointer;transition:all .15s;line-height:1.5;}
  .chip:hover{border-color:var(--teal);color:var(--teal);background:#f4fbfa;
    box-shadow:0 1px 4px rgba(0,150,136,.16);}
  .chip:active{transform:translateY(1px);}
  .chip i{font-style:normal;font-size:10.5px;letter-spacing:1.5px;margin-left:3px;}
  .pool.bull .ph{background:#fdf4f3;color:var(--red);border-bottom:1px solid #f7dfdc;}
  .pool.bull .chip{border-color:#f0d5d1;} .pool.bull .chip i{color:var(--red);}
  .pool.bear .ph{background:#f2faf7;color:var(--green);border-bottom:1px solid #d9ece5;}
  .pool.bear .chip{border-color:#d5eae2;} .pool.bear .chip i{color:var(--green);}

  .sc{border:1px solid #edeff2;border-radius:5px;padding:11px 13px;margin-bottom:9px;}
  .sc:last-child{margin-bottom:0;}
  .sc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:5px;}
  .sc-name{font-size:13.5px;font-weight:600;}
  .sc-tag{font-size:11.5px;color:var(--teal);background:#eff9f7;border:1px solid #cfe9e3;
    border-radius:3px;padding:2px 8px;}
  .sc-row{display:grid;grid-template-columns:64px 1fr;gap:8px;font-size:12.5px;color:var(--txt2);line-height:1.8;}
  .sc-row b{font-weight:400;color:var(--txt3);font-size:11.5px;}
  .sc-row.goal span{color:var(--teal);font-weight:600;}
  .note{font-size:11.5px;color:var(--txt3);margin:8px 0 0;}
  .desc{font-size:12px;color:var(--txt3);margin:0 0 10px;}

  .skel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .sk{border:1px dashed #dfe3e8;border-radius:5px;height:88px;display:flex;align-items:center;
    justify-content:center;color:#b6bdc7;font-size:12.5px;background:#fcfdfe;}

  .rail{display:grid;gap:14px;}
  .rail .card{margin:0;}
  .rail .card-b{padding:12px 14px 14px;}
  .rj{display:flex;align-items:center;justify-content:space-between;padding:6px 2px;
    cursor:pointer;border-radius:3px;border-bottom:1px dashed #f0f1f3;font-size:12px;color:var(--txt2);}
  .rj:hover{background:#f6faf9;}
  .rj:last-child{border-bottom:0;}
  .rj b{font-weight:600;color:#222;font-size:12.5px;}
  .rj i{font-style:normal;letter-spacing:1.5px;font-size:10.5px;}
  .rj.b i{color:var(--red);} .rj.s i{color:var(--green);}
  .disc{font-size:11px;color:var(--txt3);line-height:1.85;margin:0;}

  .panel{display:none;}
  .panel.on{display:block;}

  @media (max-width:1120px){
    .main{grid-template-columns:minmax(0,1fr);}
    .grid3{grid-template-columns:1fr 1fr;}
    .rail{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:820px){
    .side{transform:translateX(-100%);transition:transform .22s;width:250px;z-index:80;}
    .side.open{transform:none;box-shadow:8px 0 26px rgba(0,0,0,.3);}
    .main{margin-left:0;padding:12px;}
    .topbar{left:0;}
    .fab{display:flex;}
    .burger{width:34px;height:32px;padding:6px;background:rgba(0,150,136,.92);border-radius:6px;
      justify-content:center;gap:4px;}
    .burger span{background:#fff;}
    .search{display:none;}
    .topbar h1 small{display:none;}
    .topbar h1{font-size:13px;}
    .strip{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:10px;}
    .tile .h{height:21px;font-size:10.5px;letter-spacing:0;}
    .tile .b{padding:8px 2px 9px;}
    .tile .v{font-size:16px;}
    .tile .s{font-size:9.5px;margin-top:1px;}
    .grid3{grid-template-columns:1fr;}
    .pools{grid-template-columns:1fr;}
    .rail{grid-template-columns:1fr;}
    .skel{grid-template-columns:1fr 1fr;}
    .tabs{gap:3px;padding:4px;width:100%;box-sizing:border-box;} .tab{flex:1 1 44%;justify-content:center;padding:9px 6px;font-size:12.5px;}
    .tab .tn{display:none;}
    .info{padding:14px 15px;} .info h1{font-size:18px;margin-bottom:8px;}
    .info .meta{font-size:11.5px;gap:2px 14px;}
    .info .note{font-size:10.5px;line-height:1.8;margin-top:9px;padding-top:8px;}
    .pills{gap:6px;} .pill{padding:6px 11px;font-size:12px;}
  }
  @media print{.side,.topbar{display:none;} .main{margin:0;grid-template-columns:1fr;} .panel{display:block !important;} .rail{display:none;}}
</style>
</head>
<body>

<div class="topbar">
  <div class="burger" onclick="document.querySelector('.side').classList.toggle('open')"><span></span><span></span><span></span></div>
  <h1>研究中心内部行情策略会<small id="hdate">每周纪要</small></h1>
  <div class="search"><input id="q" placeholder="搜索品种，如：菜粕" oninput="filterByName(this.value)"></div>
  <div class="topdate" id="topdate"></div>
</div>

<aside class="side">
  <div class="brand"><i></i><b>研究中心内部行情策略会</b></div>
  <div class="grp">
    <div class="grp-t">目 录</div>
    <button class="item" data-p="p3"><span class="ic">◎</span>策略超市<span class="cnt" id="c3"></span></button>
    <button class="item on" data-p="p1"><span class="ic">◈</span>品种观点<span class="cnt" id="c1"></span></button>
    <button class="item" data-p="p2"><span class="ic">◑</span>品种多空池<span class="cnt" id="c2"></span></button>
    <button class="item" data-p="p4"><span class="ic">▤</span>账户运行情况<span class="cnt">—</span></button>
  </div>
  <div class="grp">
    <div class="grp-t">周 次</div>
    <div id="weeks"></div>
  </div>
  <div class="side-foot">渤海期货 · 研究中心<br>每周更新，上传 PPT 自动生成</div>
</aside>

<button class="fab" onclick="document.querySelector('.side').classList.toggle('open')">☰ 目录</button>

<main class="main">
  <div class="col-main">
    <div class="strip" id="strip"></div>
    <div class="tabs">
      <button class="tab" data-p="p3"><span class="ti">◎</span>策略超市<em class="tn" id="t3"></em></button>
      <button class="tab on" data-p="p1"><span class="ti">◈</span>品种观点<em class="tn" id="t1"></em></button>
      <button class="tab" data-p="p2"><span class="ti">◑</span>品种多空池<em class="tn" id="t2"></em></button>
      <button class="tab" data-p="p4"><span class="ti">▤</span>账户运行情况</button>
    </div>
    <div class="pillbar"><span class="plab">品种</span><div class="pills" id="pills"></div></div>
    <section class="panel on" id="p1"></section>
    <section class="panel" id="p2"></section>
    <section class="panel" id="p3"></section>
    <section class="panel" id="p4"></section>
  </div>
  <aside class="rail">
    <div class="card">
      <div class="card-h"><h2 style="font-size:13.5px">本周多空池</h2><span class="right" id="railcnt">共 0</span></div>
      <div class="card-b" id="railList"></div>
    </div>
  </aside>
</main>

<script>
var DATA = JSON.parse(document.getElementById("DATA").textContent);

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

function namesOf(w){
  var n = {};
  w.fund.forEach(function(b){ b.rows.forEach(function(r){ if (r[1]) n[r[1]] = 1; }); });
  return Object.keys(n).sort();
}

function renderWeeks(){
  document.getElementById("weeks").innerHTML = DATA.map(function(w,i){
    return '<button class="item wk' + (i === W ? " on" : "") + '" data-i="' + i + '"'

  }).join("");
  document.getElementById("topdate").textContent = DATA[W] ? DATA[W].date : "";
}

function pickWeek(i){ W = i; FILTER = "全部品种"; renderWeeks(); renderAll(); }

function renderTiles(w){
  var n = namesOf(w).length;
  var b = (w.pools.bull || []).length, s = (w.pools.bear || []).length;
  var st = w.strat.reduce(function(a,x){ return a + x.rows.length; }, 0);
  var t = [
    ["t1","覆盖品种",n,"本周跟踪",""],
    ["t2","多头池",b,"看多品种","#009688"],
    ["t3","空头池",s,"看空品种","#bf242a"],
    ["t4","策略超市",st,"在跟策略","#0a7d63"]
  ];
  document.getElementById("strip").innerHTML = t.map(function(x){
    return '<div class="tile ' + x[0] + '"><div class="h">' + x[1] + '</div><div class="b">'
      + '<div class="v"' + (x[4] ? ' style="color:' + x[4] + '"' : '') + '>' + x[2] + '</div>'
      + '<div class="s">' + x[3] + '</div></div></div>';
  }).join("");
  var set = function(id, v){ var e = document.getElementById(id); if (e) e.textContent = v; };
  set("c1", n); set("c2", b + s); set("c3", st);
  set("t1", n); set("t2", b + s); set("t3", st);
  set("hdate", w.date);
}


function renderPills(w){
  var names = namesOf(w).slice();
  if (FILTER !== "全部品种" && names.indexOf(FILTER) < 0) names.push(FILTER);
  document.getElementById("pills").innerHTML =
    '<button class="pill' + (FILTER === "全部品种" ? " on" : "") + '" data-name="全部品种">全部品种</button>'
    + names.map(function(n){
        return '<button class="pill' + (FILTER === n ? " on" : "") + '" data-name="' + esc(n) + '">' + esc(n) + '</button>';
      }).join("");
}

function setFilter(name){
  FILTER = name; renderPills(DATA[W]); renderSection(); scrollPillIntoView();
}

function scrollPillIntoView(){

}

function jumpOpinion(name){

    var rows = b.rows.filter(function(r){ return FILTER === "全部品种" || r[1] === FILTER; });
    if (!rows.length) return;
    var cards = rows.map(function(r){
      return '<div class="kcard" data-name="' + esc(r[1]) + '"><div class="khead">'
        + '<span class="kname">' + esc(r[1]) + '</span>'

    }).join("");
    var note = (b.note && FILTER === "全部品种") ? '<p class="note">' + esc(b.note) + '</p>' : "";
    out += '<div class="card"><div class="card-h"><h2>' + esc(b.title) + '</h2><span class="sub">'
      + rows.length + ' 个品种</span></div><div class="card-b"><div class="grid3">'
      + cards + '</div>' + note + '</div></div>';

  return out || '<div class="card"><div class="card-b"><p class="note">该品种本周暂无观点记录。</p></div></div>';
}

  return '<div class="card"><div class="card-h"><h2>多空池</h2><span class="sub">多头 ' + bull.length
    + ' · 空头 ' + bear.length + ' · 点击品种可查看观点</span></div><div class="card-b"><div class="pools">'
    + pool("bull", "多头品种池", bull) + pool("bear", "空头品种池", bear)
    + '</div></div></div>';
}

function renderStrat(w){
  if (!w.strat.length) return '<div class="card"><div class="card-b"><p class="note">本期交易策略暂无内容。</p></div></div>';
  return w.strat.map(function(s){
    var cards = s.rows.map(function(r){
      return '<div class="sc"><div class="sc-top"><span class="sc-name">' + esc(r.name) + '</span>'
        + (r.tag ? '<span class="sc-tag">' + esc(r.tag) + '</span>' : '') + '</div>'
        + '<div class="sc-row"><b>操作要点</b><span>' + esc(r.op) + '</span></div>'
        + '<div class="sc-row goal"><b>目标 / 风险</b><span>' + esc(r.goal) + '</span></div></div>';
    }).join("");
    return '<div class="card"><div class="card-h"><h2>' + esc(s.title) + '</h2></div><div class="card-b">'
      + (s.desc ? '<p class="desc">' + esc(s.desc) + '</p>' : "") + cards + '</div></div>';
  }).join("");
}

function renderAccount(){
  return '<div class="card"><div class="card-h"><h2>账户运行情况</h2><span class="sub">本期待补充</span></div>'
    + '<div class="card-b"><div class="skel">'
    + '<div class="sk">—</div><div class="sk">—</div><div class="sk">—</div><div class="sk">—</div>'
    + '</div></div></div>';
}

function renderRail(w){
  var bull = w.pools.bull || [], bear = w.pools.bear || [];
  var all = bull.map(function(x){ return [x[0], x[1], "b"]; })
    .concat(bear.map(function(x){ return [x[0], x[1], "s"]; }));
  document.getElementById("railcnt").textContent = "共 " + all.length;
  document.getElementById("railList").innerHTML = all.map(function(p){
    return '<div class="rj ' + p[2] + '" data-jump="' + esc(p[0]) + '" title="查看该品种观点"><b>'
      + esc(p[0]) + '</b><i>' + esc(p[1]) + '</i></div>';
  }).join("") || '<p class="note">本期暂无</p>';
}

function renderSection(){
  var w = DATA[W];
  document.getElementById("p1").innerHTML = renderFund(w);
  document.getElementById("p2").innerHTML = renderPools(w);
  document.getElementById("p3").innerHTML = renderStrat(w);
  document.getElementById("p4").innerHTML = renderAccount();
}

function renderAll(){
  var w = DATA[W];
  if (!w) return;
  renderTiles(w); renderPills(w); renderSection(); renderRail(w);
}

document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click", function(){ show(t.dataset.p); });
});
document.querySelectorAll(".item[data-p]").forEach(function(t){
  t.addEventListener("click", function(){ show(t.dataset.p); });
});
document.getElementById("weeks").addEventListener("click", function(e){
  var b = e.target.closest(".wk"); if (b) pickWeek(Number(b.dataset.i));
});
document.getElementById("pills").addEventListener("click", function(e){
  var b = e.target.closest(".pill"); if (b) setFilter(b.dataset.name);
});
document.addEventListener("click", function(e){
  var j = e.target.closest("[data-jump]");
  if (j) { jumpOpinion(j.dataset.jump); }
});
function show(id){
  SEC = id;
  document.querySelectorAll(".panel").forEach(function(p){ p.classList.toggle("on", p.id === id); });
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("on", t.dataset.p === id); });
  document.querySelectorAll(".item[data-p]").forEach(function(t){ t.classList.toggle("on", t.dataset.p === id); });
  document.querySelector(".side").classList.remove("open");
}

function filterByName(q){
  q = (q || "").trim();
  if (q) show("p1");
  if (!q) { setFilter("全部品种"); return; }
  var w = DATA[W], hit = namesOf(w).filter(function(n){ return n.indexOf(q) >= 0; })[0];
  if (hit) setFilter(hit);
}

(function(){ renderWeeks(); renderAll(); show("p1"); })();
</script>
</body>
</html>
